# PostgreSQL 18 configuration.
#
# Connection roles:
# - DB_ADMIN_USER (default: ledger_admin) is used ONLY by explicit migration /
#   schema preparation tasks (e.g., DB_ROLE=admin bin/rails db:prepare).
# - DB_RUNTIME_USER (default: ledger_runtime) is the least-privilege runtime role
#   used by the Rails web server and application connections.
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 5434) %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: <%= ENV["DB_ROLE"] == "admin" ? ENV.fetch("DB_ADMIN_USER", "ledger_admin") : ENV.fetch("DB_RUNTIME_USER", "ledger_runtime") %>
  password: <%= ENV["DB_ROLE"] == "admin" ? ENV.fetch("DB_ADMIN_PASSWORD", "ledger_admin_secret") : ENV.fetch("DB_RUNTIME_PASSWORD", "ledger_runtime_secret") %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DEV_DB", "taxdome_ledger_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DB", "taxdome_ledger_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "taxdome_ledger_production") %>
